<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI봇</title>
<!-- 마크다운 표시용 (marked 12.0.2, DOMPurify 3.1.6). 사내망에서도 되도록 로컬에 둔다 -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #0b6e4f; --accent-soft: #e3f2ec; --warn: #b45309; --warn-soft: #fdf1e3;
    --bad: #b42318; --bad-soft: #fde8e6; --me: #eef3fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --panel: #1a1e26; --text: #e6e8ee; --muted: #9aa1b2; --line: #2b313c;
      --accent: #4cc39a; --accent-soft: #173229; --warn: #f0a44b; --warn-soft: #33261a;
      --bad: #f2786d; --bad-soft: #3a1d1b; --me: #1e2735;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 12px; cursor: pointer; font: inherit; }
  .seg button.on { background: var(--accent); color: #fff; }
  .mode-help { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
         padding: 6px 12px; cursor: pointer; font: inherit; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 진행 표시줄 */
  .stages { display: flex; gap: 4px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
            overflow-x: auto; }
  .stage { flex: 1; min-width: 90px; text-align: center; font-size: 13px; padding: 6px 4px; border-radius: 6px;
           color: var(--muted); background: var(--bg); position: relative; }
  .stage.done { color: var(--accent); background: var(--accent-soft); }
  .stage.now { color: #fff; background: var(--accent); font-weight: 600; }
  .stage-note { padding: 4px 16px 0; font-size: 13px; color: var(--muted); min-height: 20px; }

  main { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 150px); }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; height: auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 860px; padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line);
         overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); white-space: pre-wrap; }
  .msg table { border-collapse: collapse; margin: 8px 0; font-size: 14px; display: block; overflow-x: auto; }
  .msg th, .msg td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  .msg pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .msg blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  .meta { font-size: 12px; color: var(--muted); }
  .notice { align-self: center; font-size: 13px; color: var(--warn); background: var(--warn-soft); padding: 4px 10px; border-radius: 6px; }
  .notice.err { color: var(--bad); background: var(--bad-soft); }
  .working { color: var(--muted); font-size: 13px; }
  .working::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }

  /* 검토 카드 */
  .review { max-width: 860px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 14px; }
  .review h4 { margin: 0 0 8px; font-size: 14px; }
  .critics { display: flex; gap: 8px; flex-wrap: wrap; }
  .critic { flex: 1; min-width: 160px; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .critic.PASS { background: var(--accent-soft); }
  .critic.FAIL, .critic.ERROR { background: var(--bad-soft); }
  .critic b { display: block; }
  .review details { margin-top: 6px; font-size: 13px; }
  .review li { margin-bottom: 4px; }
  .sev-치명 { color: var(--bad); font-weight: 600; } .sev-중요 { color: var(--warn); font-weight: 600; } .sev-사소 { color: var(--muted); }

  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: vertical; min-height: 56px; max-height: 40vh; padding: 8px 10px; border-radius: 8px;
             border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }

  aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: transparent; padding: 10px; cursor: pointer; color: var(--muted); font: inherit; }
  .tabs button.on { color: var(--text); border-bottom: 2px solid var(--accent); font-weight: 600; }
  .pane { flex: 1; overflow-y: auto; padding: 12px; font-size: 14px; }
  .item { padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 4px; background: var(--bg); color: var(--muted); margin-right: 4px; }
  .tag.약점 { background: var(--bad-soft); color: var(--bad); } .tag.강점, .tag.개선 { background: var(--accent-soft); color: var(--accent); }
  .cap-bars div { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 4px; }
  .cap-bars span:first-child { width: 48px; }
  .bar { height: 8px; border-radius: 4px; }

  dialog { width: min(860px, 92vw); max-height: 85vh; border: 1px solid var(--line); border-radius: 10px;
           background: var(--panel); color: var(--text); padding: 0; }
  dialog .body { padding: 16px; overflow-y: auto; max-height: calc(85vh - 50px); }
  dialog .bar-top { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>BI봇</h1>
  <div class="seg" id="modes"></div>
  <span class="mode-help" id="modeHelp"></span>
  <button class="btn" id="caseBtn" hidden>케이스 받기</button>
  <button class="btn" id="saveBtn">대화 저장</button>
  <button class="btn" id="newBtn">새 대화</button>
</header>
<div class="stages" id="stages"></div>
<div class="stage-note" id="stageNote"></div>
<main>
  <section class="chat">
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="요청을 적어 주세요. 예) 영업본부장이 '세비카 처방이 왜 빠지냐'고 물어봤어. (Ctrl+Enter로 보내기)"></textarea>
      <button class="btn primary" id="sendBtn">보내기</button>
    </form>
  </section>
  <aside>
    <div class="tabs">
      <button data-tab="docs" class="on">문서</button>
      <button data-tab="growth">성장 기록</button>
    </div>
    <div class="pane" id="docs"></div>
    <div class="pane" id="growth" hidden></div>
  </aside>
</main>
<dialog id="viewer">
  <div class="bar-top"><b id="viewerTitle"></b><button class="btn" onclick="viewer.close()">닫기</button></div>
  <div class="body msg" id="viewerBody" style="border:0"></div>
</dialog>

<script>
// ---- 상태 ----
const MODE_HELP = {
  "실전": "일을 끝내는 데 집중합니다. 답변 끝에 코칭 한 줄.",
  "훈련": "답을 먼저 주지 않고, 오너가 먼저 해 보게 한 뒤 피드백합니다.",
  "케이스": "가상 케이스를 내고 채점합니다. 약점 기록을 겨냥합니다.",
};
const CAPS = ["질문", "데이터", "가설", "소왓", "경영진", "도메인"];
let sessionId = null, mode = "실전", stages = [], currentStage = null, busy = false;

const $ = (id) => document.getElementById(id);
const md = (text) => {
  // 라이브러리를 못 불러오면 일반 텍스트로 보여준다
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text));
  const d = document.createElement("div"); d.textContent = text; return `<div style="white-space:pre-wrap">${d.innerHTML}</div>`;
};
const esc = (s) => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };

// ---- 화면 그리기 ----
function renderModes() {
  $("modes").innerHTML = "";
  for (const m of Object.keys(MODE_HELP)) {
    const b = document.createElement("button");
    b.textContent = m; b.className = m === mode ? "on" : "";
    b.onclick = () => { mode = m; renderModes(); };
    $("modes").appendChild(b);
  }
  $("modeHelp").textContent = MODE_HELP[mode];
  $("caseBtn").hidden = mode !== "케이스";
}

function renderStages() {
  const idx = stages.findIndex((s) => s.code === currentStage);
  $("stages").innerHTML = stages.map((s, i) =>
    `<div class="stage ${i < idx ? "done" : i === idx ? "now" : ""}">${i + 1}. ${esc(s.label)}</div>`).join("");
}

function addMsg(cls, html) {
  const el = document.createElement("div");
  el.className = cls; el.innerHTML = html;
  $("log").appendChild(el); $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function addReview(ev) {
  const head = ev.passed ? `✅ 검토 통과 (${ev.round}회차)`
    : ev.status === "exhausted" ? `⚠️ ${ev.max_rounds}회 검토에도 미통과 — 오너 판단 필요`
    : `🔁 ${ev.round}/${ev.max_rounds}회차 검토: 수정 후 재검토`;
  const critics = ev.results.map((r) =>
    `<div class="critic ${esc(r.verdict)}"><b>${esc(r.critic)} · ${esc(r.verdict)} · ${esc(String(r.score))}/5</b>${esc(r.summary)}</div>`).join("");
  const issues = ev.results.flatMap((r) => r.issues.map((i) =>
    `<li><span class="sev-${esc(i.severity)}">[${esc(i.severity)}]</span> <b>${esc(r.critic)}</b> · ${esc(i.where)} — ${esc(i.problem)}<br><span class="meta">수정안: ${esc(i.fix)}</span></li>`));
  addMsg("review", `<h4>${head} · ${esc(ev.title)}</h4><div class="critics">${critics}</div>` +
    (issues.length ? `<details><summary>지적 ${issues.length}건 보기</summary><ul>${issues.join("")}</ul></details>` : ""));
}

async function loadDocs() {
  const { documents } = await (await fetch("/api/documents")).json();
  $("docs").innerHTML = documents.length ? "" : `<p class="meta">아직 저장된 문서가 없습니다.</p>`;
  for (const d of documents) {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<span class="tag">${esc(d.kind)}</span><div>${esc(d.name)}</div>`;
    el.onclick = async () => {
      const r = await fetch("/api/document?path=" + encodeURIComponent(d.path));
      const { content } = await r.json();
      $("viewerTitle").textContent = d.name; $("viewerBody").innerHTML = md(content || "");
      $("viewer").showModal();
    };
    $("docs").appendChild(el);
  }
}

async function loadGrowth() {
  const { notes } = await (await fetch("/api/growth")).json();
  if (!notes.length) { $("growth").innerHTML = `<p class="meta">아직 기록이 없습니다. 대화하면서 BI봇이 패턴을 기록합니다.</p>`; return; }
  // 능력별 강점·개선 vs 약점 개수
  const count = Object.fromEntries(CAPS.map((c) => [c, { good: 0, weak: 0 }]));
  for (const n of notes) if (count[n.capability]) count[n.capability][n.kind === "약점" ? "weak" : "good"]++;
  const max = Math.max(1, ...CAPS.map((c) => count[c].good + count[c].weak));
  const bars = CAPS.map((c) => `<div><span>${c}</span>
      <span class="bar" style="width:${count[c].good / max * 160}px;background:var(--accent)"></span>
      <span class="bar" style="width:${count[c].weak / max * 160}px;background:var(--bad)"></span>
      <span class="meta">${count[c].good}/${count[c].weak}</span></div>`).join("");
  const list = notes.slice().reverse().map((n) =>
    `<div class="item" style="cursor:default"><span class="tag">${esc(n.capability)}</span><span class="tag ${esc(n.kind)}">${esc(n.kind)}</span>
     <span class="meta">${esc(n.date)}</span><div>${esc(n.observation)}</div>${n.next_time ? `<div class="meta">다음엔: ${esc(n.next_time)}</div>` : ""}</div>`).join("");
  $("growth").innerHTML = `<p class="meta">초록 = 강점·개선, 빨강 = 약점</p><div class="cap-bars">${bars}</div><hr style="border:0;border-top:1px solid var(--line)">${list}`;
}

// ---- 대화 ----
async function newSession() {
  const r = await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode }) });
  sessionId = (await r.json()).session_id;
  currentStage = null; renderStages(); $("stageNote").textContent = "";
  $("log").innerHTML = "";
  addMsg("msg", md("안녕하세요, BI봇입니다. 받으신 요청이나 고민 중인 분석을 그대로 적어 주세요.\n\n" +
    "- **실전**: 일을 끝내고 코칭 한 줄\n- **훈련**: 먼저 해 보시면 피드백\n- **케이스**: 가상 케이스 연습\n\n" +
    "모드는 대화 중에도 위에서 바꿀 수 있습니다."));
}

async function send(text) {
  if (busy || !text.trim()) return;
  busy = true; $("sendBtn").disabled = true;
  addMsg("msg me", esc(text));
  let bubble = null, buf = "", working = addMsg("working", "생각 중");

  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, text, mode }) });
    if (!r.ok) { working.remove(); addMsg("notice err", esc((await r.json()).detail || r.statusText)); return; }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let pending = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += dec.decode(value, { stream: true });
      const lines = pending.split("\n"); pending = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "working") {
          if (!working) working = addMsg("working", "생각 중");
        } else if (ev.type === "text") {
          if (working) { working.remove(); working = null; }
          if (!bubble) { bubble = addMsg("msg", ""); buf = ""; }
          buf += ev.text; bubble.innerHTML = md(buf);
          $("log").scrollTop = $("log").scrollHeight;
        } else if (ev.type === "tool") {
          // 도구 다음에 오는 글은 새 말풍선으로 (검토 카드 등이 사이에 들어가도록)
          bubble = null;
          if (working) working.textContent = ev.name === "review_draft" ? "비평가 3명이 검토 중" : "작업 중";
        } else if (ev.type === "stage") {
          currentStage = ev.stage; renderStages(); $("stageNote").textContent = ev.note || "";
        } else if (ev.type === "review") {
          if (working) { working.remove(); working = null; }
          addReview(ev);
        } else if (ev.type === "doc") {
          addMsg("notice", "📄 저장: " + esc(ev.title)); loadDocs();
        } else if (ev.type === "growth") {
          addMsg("notice", `🌱 성장 기록: [${esc(ev.note.capability)}·${esc(ev.note.kind)}] ${esc(ev.note.observation)}`); loadGrowth();
        } else if (ev.type === "notice") {
          addMsg("notice", esc(ev.text));
        } else if (ev.type === "error") {
          addMsg("notice err", esc(ev.text));
        }
      }
    }
  } catch (e) {
    addMsg("notice err", "연결이 끊겼습니다: " + esc(e.message));
  } finally {
    if (working) working.remove();
    busy = false; $("sendBtn").disabled = false;
  }
}

// ---- 이벤트 연결 ----
$("form").onsubmit = (e) => { e.preventDefault(); const t = $("input").value; $("input").value = ""; send(t); };
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit(); });
$("caseBtn").onclick = () => send("케이스 하나 내 주세요.");
$("newBtn").onclick = () => { if (!busy) newSession(); };
$("saveBtn").onclick = async () => {
  const r = await fetch(`/api/session/${sessionId}/save`, { method: "POST" });
  addMsg("notice", "대화 저장: " + esc((await r.json()).path));
};
document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("docs").hidden = b.dataset.tab !== "docs"; $("growth").hidden = b.dataset.tab !== "growth";
});

(async () => {
  stages = (await (await fetch("/api/config")).json()).stages;
  renderModes(); renderStages(); await newSession(); loadDocs(); loadGrowth();
})();
</script>
</body>
</html>
