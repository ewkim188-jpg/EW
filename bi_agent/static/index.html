<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI봇</title>
<!-- 마크다운 표시용 (marked 12.0.2, DOMPurify 3.1.6). 사내망에서도 되도록 로컬에 둔다 -->
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e4e6ee;
    --accent: #4f46e5; --accent-soft: #eef0ff; --ok: #16a34a; --ok-soft: #e8f7ee;
    --warn: #b45309; --warn-soft: #fdf3e5; --bad: #c2410c; --bad-soft: #fdebe3; --soft: #f7f8fc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12141b; --panel: #1a1d27; --text: #e7e9f0; --muted: #9aa1b4; --line: #2c3040;
      --accent: #8b85ff; --accent-soft: #25264a; --ok: #4ade80; --ok-soft: #173023;
      --warn: #f5a54a; --warn-soft: #33261a; --bad: #fb8b62; --bad-soft: #3a2119; --soft: #20232f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button { font: inherit; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 24px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  .badge { background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; padding: 5px 10px; border-radius: 6px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .who { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px;
          background: var(--soft); border: 1px solid var(--line); font-size: 13px; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 6px; }
  .linkbtn.red { color: var(--bad); }

  /* 단계 표시줄 */
  .stepper { display: flex; align-items: center; padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .st { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  .st .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
             border: 2px solid var(--line); color: var(--muted); background: var(--panel); }
  .st .lbl { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .st.done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
  .st.now .dot { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 4px var(--accent-soft); }
  .st.now .lbl { color: var(--accent); font-weight: 600; } .st.done .lbl { color: var(--text); }
  .line { flex: 1 1 40px; min-width: 24px; height: 2px; background: var(--line); margin: 0 12px; }
  .line.done { background: var(--ok); }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; min-width: 0; }
  .stepchip { display: inline-block; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-soft);
              font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
  .card h2 { font-size: 22px; margin: 10px 0 4px; }
  .desc { color: var(--muted); margin: 0 0 18px; }
  .row { display: flex; justify-content: space-between; align-items: start; gap: 12px; flex-wrap: wrap; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

  label.f { display: block; font-weight: 600; margin: 14px 0 6px; }
  label.f small { font-weight: 400; color: var(--muted); }
  input[type=text], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
         background: var(--panel); color: var(--text); font: inherit; }
  textarea { resize: vertical; min-height: 76px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; padding: 11px 18px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .actions { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }

  .box { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; background: var(--panel); }
  .box.soft { background: var(--soft); }
  .box.ok { background: var(--ok-soft); border-left: 4px solid var(--ok); }
  .hyp .bar { height: 8px; background: var(--line); border-radius: 4px; margin: 10px 0; overflow: hidden; }
  .hyp .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .gap { background: var(--warn-soft); color: var(--warn); padding: 6px 10px; border-radius: 6px; font-size: 14px; }
  .gap b { color: var(--warn); }
  .q h4 { margin: 0 0 6px; font-size: 16px; }
  .rec { border: 1px dashed var(--line); background: var(--soft); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: 14px;
         display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .rec.hidden-rec { color: var(--muted); }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 6px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
  .tag.cap { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  details.box > summary { cursor: pointer; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }

  /* 리서치 */
  .track h3 { margin: 0; font-size: 17px; }
  .queries { background: var(--soft); border-radius: 8px; padding: 10px; font-size: 13px; color: var(--muted); margin: 10px 0; }
  .finding { display: flex; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; font-size: 14px; }
  .finding input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: 0 0 auto; }
  .cite { font-size: 12px; color: var(--accent); border: 1px solid var(--accent-soft); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
  .sources { font-size: 13px; margin-top: 8px; }
  .sources a { color: var(--accent); word-break: break-all; }

  /* 명세 */
  .spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  @media (max-width: 760px) { .spec-grid { grid-template-columns: 1fr; } }
  .spec-grid h5 { margin: 12px 0 4px; font-size: 14px; }
  .spec-grid ul { margin: 0; padding-left: 18px; font-size: 14px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0; display: block; overflow-x: auto; }
  .tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
  .tbl th { background: var(--soft); white-space: nowrap; }
  .scores { display: flex; gap: 10px; flex-wrap: wrap; }
  .score { flex: 1; min-width: 180px; border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .score.pass { background: var(--ok-soft); } .score.fail { background: var(--bad-soft); }

  /* 승인 */
  .confirm { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 14px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .confirm input { width: 22px; height: 22px; accent-color: var(--accent); }
  .choice { border: 2px solid var(--line); border-radius: 14px; padding: 18px; cursor: pointer; position: relative; }
  .choice.on { border-color: var(--accent); background: var(--accent-soft); }
  .choice .ico { font-size: 28px; } .choice h4 { margin: 8px 0 2px; } .choice .en { color: var(--muted); font-size: 13px; }

  .md { overflow-wrap: anywhere; }
  .md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; vertical-align: top; }
  .md blockquote { margin: 8px 0; padding: 6px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); }

  /* 실행 로그 */
  .log h3 { margin: 0; font-size: 17px; }
  .log-item { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .log-item .t { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .log-item .note { font-size: 13px; color: var(--muted); }

  /* 진행 모달 */
  .overlay { position: fixed; inset: 0; background: rgba(20, 22, 35, .55); backdrop-filter: blur(3px); display: none; place-items: center; z-index: 10; padding: 16px; }
  .overlay.on { display: grid; }
  .modal { background: var(--panel); border-radius: 16px; padding: 32px 40px; width: min(560px, 100%); text-align: center; }
  .spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--accent-soft); border-top-color: var(--accent); margin: 0 auto 16px; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .modal b { font-size: 18px; display: block; } .modal p { color: var(--muted); margin: 8px 0 18px; }
  .prog { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .prog i { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 10px 16px; border-radius: 8px; display: none; z-index: 11; max-width: 90vw; }

  dialog { width: min(900px, 94vw); max-height: 86vh; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 0; }
  dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  dialog .db { padding: 16px 20px; overflow-y: auto; max-height: calc(86vh - 60px); }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <span class="badge">⚡ BI봇</span>
  <div><h1>BI 분석 설계 에이전트</h1><div class="sub">한국다이이찌산쿄 BI · 요청 재정의 → 분석 명세 → 오너 성장</div></div>
  <div class="who">
    <button class="linkbtn" onclick="openGrowth()">🌱 성장 기록</button>
    <button class="linkbtn" onclick="openDocs()">📄 저장 문서</button>
    <span class="chip" id="whoChip" hidden></span>
  </div>
</header>
<nav class="stepper" id="stepper"></nav>
<div class="layout">
  <main class="card" id="main"></main>
  <aside class="card log">
    <div class="row"><h3>🤖 에이전트 실행 로그</h3><span class="chip" id="logCount">0건</span></div>
    <div class="meta">에이전트 · 걸린 시간 · 일하는 패턴</div>
    <div id="log"></div>
  </aside>
</div>
<div class="overlay" id="overlay"><div class="modal"><div class="spin"></div><b id="busyTitle"></b><p id="busyDesc"></p><div class="prog"><i></i></div></div></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><button class="btn sm" onclick="dlg.close()">닫기</button></div><div class="db" id="dlgBody"></div></dialog>

<script>
const STEPS = ["요청 접수", "진단 인터뷰", "다각도 리서치", "명세 & 비판", "최종 승인", "산출물 완성"];
const CAPS = ["질문", "데이터", "가설", "소왓", "경영진", "도메인"];
const TYPE_INFO = {
  exec: { ico: "👔", en: "Executive Brief", d: "결론 1줄 · 근거 3 · 권고 1, 예상 반문과 답, 일정·자원" },
  orchestrator: { ico: "🧩", en: "Orchestrator Request", d: "작업 분해 표(담당 봇·선행·병렬/순차·완료 기준), 리뷰봇→컴봇 게이트" },
  reply: { ico: "✉️", en: "Reply to Requester", d: "재정의한 질문, 분석 계획, 답할 수 있는 것/없는 것, 현업에 부탁할 것" },
};
let P = null;                 // 서버가 돌려준 프로젝트 상태
let form = { mode: "실전" };   // 1단계 입력
let caseLog = null;            // 케이스 생성 로그 (프로젝트 만들기 전)
let reportType = "exec", approvedChecked = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const md = (t) => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(t || "")) : `<pre style="white-space:pre-wrap">${esc(t)}</pre>`;
// 링크는 http(s)만 허용한다 (javascript: 같은 주소로 스크립트가 실행되지 않게)
const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch (e) { return "#"; } };
const training = () => (P ? P.intake.mode : form.mode) === "훈련";

// ---- 서버 호출 (진행 모달 포함) ----
async function call(url, body, title, desc) {
  $("busyTitle").textContent = title; $("busyDesc").textContent = desc; $("overlay").classList.add("on");
  try {
    const r = await fetch(url, { method: body === undefined ? "GET" : "POST", headers: { "Content-Type": "application/json" },
                                 body: body === undefined ? undefined : JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    return data;
  } catch (e) { toast(e.message); return null; }
  finally { $("overlay").classList.remove("on"); }
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; setTimeout(() => t.style.display = "none", 6000); }
function setP(data) {
  if (!data) return; P = data;
  try { localStorage.setItem("bi_project", P.id); } catch (e) {}
  render();
}

// ---- 공통 그리기 ----
function render() {
  const step = P ? P.step : 1;
  $("stepper").innerHTML = STEPS.map((s, i) => {
    const n = i + 1, cls = n < step ? "done" : n === step ? "now" : "";
    return (i ? `<div class="line ${n <= step ? "done" : ""}"></div>` : "") +
      `<div class="st ${cls}"><div class="dot">${n < step ? "✓" : n}</div><div class="lbl">${s}</div></div>`;
  }).join("");
  const who = $("whoChip");
  if (P) { who.hidden = false; who.innerHTML = `<b>${esc(P.intake.dept || "현업")}</b> ${esc(P.intake.requester || "")} <span class="tag ${P.intake.mode === "훈련" ? "cap" : ""}">${esc(P.intake.mode)}</span><button class="linkbtn red" onclick="resetAll()">초기화</button>`; }
  else who.hidden = true;
  const logs = P ? P.log : (caseLog ? [caseLog] : []);
  $("logCount").textContent = logs.length + "건";
  $("log").innerHTML = logs.slice().reverse().map((l) => `<div class="log-item"><div class="row"><b>🤖 ${esc(l.agent)}</b><span class="t">${esc(String(l.seconds))}초</span></div>
    <span class="tag cap">${esc(l.pattern)}</span> <span class="note">${esc(l.note || "")}</span></div>`).join("");
  [renderIntake, renderInterview, renderResearch, renderSpec, renderApprove, renderDone][step - 1]();
  window.scrollTo({ top: 0 });
}
const head = (n, title, desc, right = "") =>
  `<div class="row"><span class="stepchip">Step ${n} · ${STEPS[n - 1]}</span>${right}</div><h2>${title}</h2><p class="desc">${desc}</p>`;

// 질문 카드 (인터뷰·비판 공용). 훈련 모드에서는 추천 답변을 먼저 숨긴다.
function qCard(q, i, label, recLabel, tag) {
  const hide = training();
  return `<div class="box q" data-i="${i}">
    <div class="row"><h4>${label}${q.title ? ". " + esc(q.title) : ""}</h4>${tag}</div>
    <div>${esc(q.question)}</div>
    <div class="rec ${hide ? "hidden-rec" : ""}" id="rec${i}">
      ${hide ? `<span>🔒 <b>${recLabel}</b>은 먼저 직접 답해 보신 뒤 열립니다. (훈련 모드)</span>
                <button class="btn sm" onclick="revealRec(${i}, true)">모르겠어요 · 보기</button>`
             : recBody(i, recLabel, q.recommended)}
    </div>
    <textarea id="ans${i}" placeholder="직접 답변을 적어 주세요" oninput="onAnswer(${i})"></textarea>
  </div>`;
}
const recBody = (i, label, text) => `<span><b>${label}:</b> ${esc(text)}</span><button class="btn sm" onclick="useRec(${i})">💡 추천대로</button>`;
const usedRec = {};
function currentQs() { return P.step === 2 ? P.rounds.at(-1).questions : P.spec_rounds.at(-1).critic.questions; }
function recLabelNow() { return P.step === 2 ? "추천 답변" : "추천 방어 논리"; }
function revealRec(i, gaveUp) {
  $("rec" + i).classList.remove("hidden-rec");
  $("rec" + i).innerHTML = recBody(i, recLabelNow(), currentQs()[i].recommended);
  if (gaveUp) usedRec[i] = true;  // 직접 답하기 전에 본 경우는 '추천 사용'으로 기록 → 코칭에서 구분
}
function onAnswer(i) { if (training() && $("ans" + i).value.trim().length >= 15 && $("rec" + i).classList.contains("hidden-rec")) revealRec(i, false); }
function useRec(i) { $("ans" + i).value = currentQs()[i].recommended; usedRec[i] = true; }
function collectAnswers(n) { return Array.from({ length: n }, (_, i) => ({ answer: $("ans" + i)?.value || "", used_recommended: !!usedRec[i] })); }
function clearUsed() { for (const k in usedRec) delete usedRec[k]; }

// ---- 1. 요청 접수 ----
function renderIntake() {
  const f = form;
  $("main").innerHTML = head(1, "어떤 요청을 받으셨나요?",
    "현업에게 받은 요청을 받은 그대로 적어 주세요. Interviewer가 가설을 세우고 진단 인터뷰를 시작합니다.") + `
    <div class="grid2">
      <div><label class="f">요청자</label><input type="text" id="requester" value="${esc(f.requester)}" placeholder="예: 김OO 본부장"></div>
      <div><label class="f">부서</label><input type="text" id="dept" value="${esc(f.dept)}" placeholder="예: CV 영업본부"></div>
      <div><label class="f">의사결정자 <small>(이 결과로 결정하는 사람)</small></label><input type="text" id="decision_maker" value="${esc(f.decision_maker)}" placeholder="모르면 비워 두세요"></div>
      <div><label class="f">기한</label><input type="text" id="deadline" value="${esc(f.deadline)}" placeholder="예: 다음 주 월요일 본부 회의 전"></div>
    </div>
    <label class="f">받은 요청 원문 <small>(예: "세비카 처방이 요즘 왜 빠지는지 자료 좀 줘")</small></label>
    <textarea id="request" style="min-height:120px">${esc(f.request)}</textarea>
    <label class="f">모드</label>
    <div class="seg"><button class="${f.mode === "실전" ? "on" : ""}" onclick="setMode('실전')">실전</button><button class="${f.mode === "훈련" ? "on" : ""}" onclick="setMode('훈련')">훈련</button></div>

function srcLinks(sources) {
  return (sources || []).map((s) => `<a class="cite" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener" title="${esc(s.title)}">${s.verified ? "" : "⚠"}${esc(hostOf(s.url))}</a>`).join(" ");
}
function hostOf(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u || "출처"; } }
function addNote() {
  if (notes.length >= P.limits.notes) return;
  const i = notes.push("") - 1, el = document.createElement("div");

async function submitInterview(skip) {
  const r = P.rounds.at(-1);
  const answers = collectAnswers(r.questions.length);
  if (!skip && !r.ready && answers.every((a) => !a.answer.trim())) return toast("질문에 하나 이상 답해 주세요.");
  const body = { answers, notes, skip: skip || r.ready };
  const willResearch = body.skip || P.rounds.length >= P.limits.interview;
  const d = await call(`/api/project/${P.id}/interview`, body,
    willResearch ? "ResearchTeam이 3개 트랙을 동시에 조사 중… (약 1분)" : "🔍 Scout가 빠르게 검색하고 다음 질문을 준비 중… (약 30초)",

  if (d) { notes = []; clearUsed(); setP(d); }
}

function trackCard(k, t) {
  const left = P.limits.retries - (t.retries || 0);
  return `<div class="box track">
    <div class="row"><h3>${{ data: "🗂️", market: "📈", method: "🧭" }[k]} ${esc(P.tracks_meta[k])}</h3><span class="chip">재조사 ${t.retries || 0}/${P.limits.retries}</span></div>

    ${t.findings.map((f, i) => `<label class="finding"><input type="checkbox" id="f_${k}_${i}" ${f.selected ? "checked" : ""}>
        <span>${esc(f.text)} ${f.cites.map((c) => `<span class="cite">[${c}]</span>`).join("")}</span></label>`).join("")}
    ${t.sources.length ? `<div class="sources"><b class="meta">참고 출처 및 근거:</b><br>${t.sources.map((s) =>
        `<div><span class="cite">[${s.n}]</span> ${s.verified ? "" : "⚠ "}<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(hostOf(s.url))}</a> <span class="meta">${esc(s.title)}</span></div>`).join("")}</div>` : ""}

function saveSelections() {
  const sel = {};
  for (const k of Object.keys(P.tracks)) sel[k] = P.tracks[k].findings.map((_, i) => $(`f_${k}_${i}`).checked);
  return sel;
}
async function retryTrack(k) {
  const memo = $("memo").value, sel = saveSelections();
  const d = await call(`/api/project/${P.id}/research/${k}`, { instruction: $("retry_" + k).value },
    `Researcher_${k}가 다시 조사 중… (약 40초)`, "추가 지시를 반영해 이 트랙만 다시 조사합니다.");
  if (d) {
    d.research_memo = memo;
    for (const [tk, flags] of Object.entries(sel)) if (tk !== k) d.tracks[tk].findings.forEach((f, i) => f.selected = flags[i]);
    setP(d);
  }
}
async function buildSpec() {
  setP(await call(`/api/project/${P.id}/spec`, { selections: saveSelections(), memo: $("memo").value },
    "명세 초안 작성 및 비판단 소집 중… (약 1분)", "선택한 리서치 근거와 메모로 Planner가 명세를 쓰고, Critic 검증단이 검토합니다."));
}

function specView(s) {

    ${pass ? `<div class="box ok">✅ 기준 통과 (세 관점 모두 4점 이상). 아래 질문에 답하면 승인 단계에서 근거로 남습니다.</div>` :
      last ? `<div class="gap" style="margin-top:12px">최대 ${P.limits.critic}회차입니다. 남은 지적은 한계로 남기고 승인 단계로 넘어갑니다.</div>` : ""}

async function refine(finish) {
  const c = P.spec_rounds.at(-1).critic;

  const goingOn = !finish && c.verdict !== "PASS" && P.spec_rounds.length < P.limits.critic;
  if (goingOn && answers.every((a) => !a.answer.trim())) return toast("비판 질문에 하나 이상 답해 주세요.");
  const d = await call(`/api/project/${P.id}/refine`, { answers, finish },
    goingOn ? "Planner가 방어 논리를 반영해 명세를 고치는 중… (약 1분)" : "승인 단계를 준비 중…",
    goingOn ? "고친 명세를 Critic 검증단이 다시 검토합니다." : "");
  if (d) { clearUsed(); setP(d); }
}

// ---- 6. 산출물 완성 ----
function renderDone() {
  const reps = [P.report, ...P.extra_reports].filter(Boolean), co = P.coaching || {};
  const made = new Set(reps.map((r) => r.type));
  $("main").innerHTML = head(6, "산출물 완성", "승인한 명세로 만든 산출물입니다. 저장 문서에도 들어 있습니다.") + `
    <div style="display:flex;gap:8px;flex-wrap:wrap">${Object.entries(P.report_types).filter(([k]) => !made.has(k)).map(([k, l]) =>
      `<button class="btn sm" onclick="extra('${k}')">${k === "orchestrator" ? "🧩 오케스트레이터 요청서 만들기 (Architect)" : "+ " + esc(l) + "도 만들기"}</button>`).join("")}</div>
    ${reps.map((r, i) => `<div class="box"><div class="row"><span class="stepchip">${esc(r.label)}</span>
        <span><button class="btn sm" onclick="dl(${i},'md')">⬇ 마크다운</button> <button class="btn sm primary" onclick="dl(${i},'html')">⬇ HTML 보고서</button></span></div>
        <div class="md">${md(r.markdown)}</div><div class="meta">저장: outputs/${esc(r.path)}</div></div>`).join("")}
    ${coachView(co)}
    <div class="actions"><span></span><button class="btn primary" onclick="resetAll()">새 요청 시작</button></div>`;
}
function coachView(co) {
  if (co.error) return `<div class="gap">코칭 생성 실패: ${esc(co.error)}</div>`;
  if (!co.capability_scores) return "";
  const sc = Object.fromEntries(co.capability_scores.map((s) => [s.capability, s]));
  return `<div class="box soft"><h3 style="margin-top:0">🌱 이번 건 코칭 (Coach)</h3>
    ${P.intake.trap ? `<div class="box ok"><b>🎯 케이스 함정 공개:</b> ${esc(P.intake.trap)}</div>` : ""}
    <table class="tbl"><tr>${CAPS.map((c) => `<th>${c}</th>`).join("")}</tr><tr>${CAPS.map((c) => {
      const s = sc[c]; return `<td title="${esc(s?.evidence)}">${s && s.score ? "●".repeat(s.score) + "○".repeat(3 - s.score) : '<span class="meta">이번엔 안 보임</span>'}</td>`; }).join("")}</tr></table>
    <p><b>👍 잘한 점</b> ${esc(co.strength)}</p>
    ${co.improvements.map((m) => `<div class="box"><span class="tag cap">${esc(m.capability)}</span> <b>한 단계 위로</b>
      <div class="meta" style="margin-top:6px">당신의 문장</div><div>${esc(m.your_text)}</div>
      <div class="meta" style="margin-top:6px">한 단계 위 버전</div><div><b>${esc(m.better)}</b></div><div class="meta">${esc(m.why)}</div></div>`).join("")}
    <p><b>➡ 다음 건에서 해 볼 것</b> ${esc(co.next_time)}</p>
    ${co.recommended_usage_note ? `<p class="meta">💡 ${esc(co.recommended_usage_note)}</p>` : ""}
    ${co.growth_notes.length ? `<p class="meta">성장 기록에 ${Math.min(2, co.growth_notes.length)}건 남겼습니다: ${co.growth_notes.slice(0, 2).map((g) => `[${esc(g.capability)}·${esc(g.kind)}] ${esc(g.observation)}`).join(" / ")}</p>` : ""}
  </div>`;
}
async function extra(k) {
  setP(await call(`/api/project/${P.id}/extra`, { report_type: k },
    k === "orchestrator" ? "Architect가 오케스트레이터 요청서를 작성 중… (약 30초)" : "Reporter가 산출물을 작성 중… (약 30초)",
    k === "orchestrator" ? "이데·서치봇 등이 되묻지 않고 바로 실행할 수 있는 작업 분해 요청서를 만듭니다." : ""));
}
function dl(i, kind) {
  const r = [P.report, ...P.extra_reports].filter(Boolean)[i];
  const name = (r.title || "BI봇").replace(/[\\/:*?"<>|]/g, "_");
  const body = kind === "md" ? r.markdown :
    `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(r.title)}</title><style>
      body{font:15px/1.7 "Malgun Gothic","Apple SD Gothic Neo",sans-serif;max-width:880px;margin:40px auto;padding:0 20px;color:#1d2330}
      table{border-collapse:collapse}th,td{border:1px solid #ddd;padding:4px 8px;vertical-align:top}th{background:#f5f6fa}
      blockquote{border-left:3px solid #4f46e5;background:#eef0ff;margin:8px 0;padding:6px 12px}h1,h2{color:#312e81}</style></head>
      <body><p style="color:#6b7385">${esc(r.label)} · BI봇 · ${esc(P.created)}</p>${md(r.markdown)}</body></html>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: kind === "md" ? "text/markdown" : "text/html" }));
  // 문서에 붙였다가 떼야 파일 이름이 적용된다. 주소는 다운로드가 시작된 뒤에 해제한다
  a.download = `${name}.${kind}`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---- 성장 기록·문서 창 ----
async function openGrowth() {
  const { notes: ns } = await (await fetch("/api/growth")).json();
  const count = Object.fromEntries(CAPS.map((c) => [c, { g: 0, w: 0 }]));
  for (const n of ns) if (count[n.capability]) count[n.capability][n.kind === "약점" ? "w" : "g"]++;
  $("dlgTitle").textContent = "🌱 성장 기록";
  $("dlgBody").innerHTML = !ns.length ? `<p class="meta">아직 기록이 없습니다. 한 건을 끝까지 진행하면 Coach가 기록합니다.</p>` :
    `<table class="tbl"><tr><th>능력</th>${CAPS.map((c) => `<th>${c}</th>`).join("")}</tr>
      <tr><td>강점·개선</td>${CAPS.map((c) => `<td style="color:var(--ok)">${count[c].g}</td>`).join("")}</tr>
      <tr><td>약점</td>${CAPS.map((c) => `<td style="color:var(--bad)">${count[c].w}</td>`).join("")}</tr></table>` +
    ns.slice().reverse().map((n) => `<div class="item" style="cursor:default"><span class="tag cap">${esc(n.capability)}</span>
      <span class="tag ${n.kind === "약점" ? "bad" : "ok"}">${esc(n.kind)}</span> <span class="meta">${esc(n.date)}</span>
      <div>${esc(n.observation)}</div>${n.next_time ? `<div class="meta">다음엔: ${esc(n.next_time)}</div>` : ""}</div>`).join("");
  $("dlg").showModal();
}
async function openDocs() {
  const { documents } = await (await fetch("/api/documents")).json();
  $("dlgTitle").textContent = "📄 저장 문서";
  $("dlgBody").innerHTML = documents.length ? "" : `<p class="meta">아직 저장된 문서가 없습니다.</p>`;
  for (const d of documents) {
    const el = document.createElement("div"); el.className = "item";
    el.innerHTML = `<span class="tag">${esc(d.kind)}</span> ${esc(d.name)}`;
    el.onclick = async () => {
      const { content } = await (await fetch("/api/document?path=" + encodeURIComponent(d.path))).json();
      $("dlgTitle").textContent = d.name; $("dlgBody").innerHTML = `<div class="md">${md(content)}</div>`;
    };
    $("dlgBody").appendChild(el);
  }
  $("dlg").showModal();
}

function resetAll() {
  if (P && P.step < 6 && !confirm("진행 중인 건을 닫고 처음으로 돌아갈까요? (지금까지 내용은 outputs/projects/ 에 저장되어 있습니다)")) return;
  P = null; form = { mode: "실전" }; caseLog = null; notes = []; approvedChecked = false; reportType = "exec"; clearUsed();
  try { localStorage.removeItem("bi_project"); } catch (e) {}
  render();
}

// 새로고침해도 진행 중인 건을 이어서 본다 (서버를 껐다 켜면 처음부터)
(async () => {
  let pid = null;
  try { pid = localStorage.getItem("bi_project"); } catch (e) {}
  if (pid) { const r = await fetch(`/api/project/${pid}`); if (r.ok) { P = await r.json(); } }
  render();
})();
</script>
